<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="draftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="46" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" letter-spacing="3" opacity="0.6">SPECULATIVE DECODING ENGINE</text>

  <!-- ── DRAFT MODEL BOX ── -->
  <rect x="60" y="80" width="190" height="80" rx="14" fill="#6366f122" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="108" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600" letter-spacing="1">DRAFT MODEL</text>
  <text x="155" y="128" text-anchor="middle" fill="#7c3aed" font-size="10">(fast · small)</text>
  <text x="155" y="148" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ proposes k tokens</text>

  <!-- Draft tokens row -->
  <text x="60" y="196" fill="#94a3b8" font-size="10" letter-spacing="1">PROPOSED TOKENS</text>
  <!-- Token boxes -->
  <rect x="60" y="204" width="46" height="30" rx="7" fill="#6366f133" stroke="#6366f1" stroke-width="1.5"/>
  <text x="83" y="224" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">"The"</text>

  <rect x="114" y="204" width="46" height="30" rx="7" fill="#6366f133" stroke="#6366f1" stroke-width="1.5"/>
  <text x="137" y="224" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">"cat"</text>

  <rect x="168" y="204" width="46" height="30" rx="7" fill="#6366f133" stroke="#6366f1" stroke-width="1.5"/>
  <text x="191" y="224" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">"sat"</text>

  <rect x="222" y="204" width="46" height="30" rx="7" fill="#6366f144" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="245" y="224" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">"on"</text>

  <!-- Arrow right to target -->
  <path d="M 290 219 L 380 219" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>
  <text x="335" y="212" text-anchor="middle" fill="#64748b" font-size="9">batch verify</text>

  <!-- ── TARGET MODEL BOX ── -->
  <rect x="390" y="80" width="200" height="80" rx="14" fill="#06b6d422" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="490" y="108" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600" letter-spacing="1">TARGET MODEL</text>
  <text x="490" y="128" text-anchor="middle" fill="#0891b2" font-size="10">(accurate · large)</text>
  <text x="490" y="148" text-anchor="middle" fill="#a5f3fc" font-size="11">🔍 single batched pass</text>

  <!-- Verify results -->
  <text x="390" y="196" fill="#94a3b8" font-size="10" letter-spacing="1">VERIFICATION</text>

  <!-- ✓ accepted tokens -->
  <rect x="390" y="204" width="46" height="30" rx="7" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
  <text x="413" y="220" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">✓</text>
  <text x="413" y="231" text-anchor="middle" fill="#6ee7b7" font-size="8">"The"</text>

  <rect x="444" y="204" width="46" height="30" rx="7" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
  <text x="467" y="220" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">✓</text>
  <text x="467" y="231" text-anchor="middle" fill="#6ee7b7" font-size="8">"cat"</text>

  <rect x="498" y="204" width="46" height="30" rx="7" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
  <text x="521" y="220" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">✓</text>
  <text x="521" y="231" text-anchor="middle" fill="#6ee7b7" font-size="8">"sat"</text>

  <!-- ✗ rejected token -->
  <rect x="552" y="204" width="46" height="30" rx="7" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
  <text x="575" y="220" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">✗</text>
  <text x="575" y="231" text-anchor="middle" fill="#fca5a5" font-size="8">"on"</text>

  <!-- ── BOTTOM STATS ROW ── -->
  <!-- Speedup -->
  <rect x="60" y="270" width="155" height="68" rx="12" fill="#ffffff06" stroke="#334155" stroke-width="1"/>
  <text x="138" y="295" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="800">2–3×</text>
  <text x="138" y="313" text-anchor="middle" fill="#94a3b8" font-size="10">faster inference</text>
  <text x="138" y="328" text-anchor="middle" fill="#64748b" font-size="9">vs standard sampling</text>

  <!-- Semantic Cache -->
  <rect x="230" y="270" width="155" height="68" rx="12" fill="#ffffff06" stroke="#334155" stroke-width="1"/>
  <text x="307" y="293" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">SEMANTIC CACHE</text>
  <text x="307" y="312" text-anchor="middle" fill="#94a3b8" font-size="10">cosine sim ≥ 0.92</text>
  <text x="307" y="328" text-anchor="middle" fill="#64748b" font-size="9">skips inference entirely</text>

  <!-- Load Router -->
  <rect x="400" y="270" width="155" height="68" rx="12" fill="#ffffff06" stroke="#334155" stroke-width="1"/>
  <text x="478" y="293" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">LOAD ROUTER</text>
  <text x="478" y="312" text-anchor="middle" fill="#94a3b8" font-size="10">high load → fast draft</text>
  <text x="478" y="328" text-anchor="middle" fill="#64748b" font-size="9">low load → better draft</text>

  <!-- Request Batcher -->
  <rect x="570" y="270" width="165" height="68" rx="12" fill="#ffffff06" stroke="#334155" stroke-width="1"/>
  <text x="652" y="293" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">BATCHER</text>
  <text x="652" y="312" text-anchor="middle" fill="#94a3b8" font-size="10">groups reqs in ~50ms</text>
  <text x="652" y="328" text-anchor="middle" fill="#64748b" font-size="9">single batched forward pass</text>

  <!-- Bottom label -->
  <text x="400" y="380" text-anchor="middle" fill="#475569" font-size="10" letter-spacing="2">MATHEMATICALLY IDENTICAL OUTPUT · SIGNIFICANTLY FASTER</text>

  <!-- Glow accent lines -->
  <line x1="0" y1="370" x2="800" y2="370" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
</svg>
