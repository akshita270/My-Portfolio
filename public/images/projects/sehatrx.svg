<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b2b"/>
      <stop offset="60%" style="stop-color:#0f3a35"/>
      <stop offset="100%" style="stop-color:#081e1e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2dd4bf60"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff05" stroke-width="1"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Header -->
  <text x="400" y="44" text-anchor="middle" fill="#2dd4bf" font-size="22" font-weight="800" letter-spacing="-0.5">Sehat<tspan fill="#f59e0b">Rx</tspan></text>
  <text x="400" y="62" text-anchor="middle" fill="#5eead4" font-size="10" letter-spacing="2" opacity="0.6">CONSULTATIONS TO PRESCRIPTIONS · WITHOUT THE PAPERWORK</text>

  <!-- ── STEP 1: CONSULTATION ── -->
  <rect x="42" y="88" width="165" height="88" rx="14" fill="#14b8a610" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="124" y="114" text-anchor="middle" font-size="20">🎙️</text>
  <text x="124" y="134" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">RECORD</text>
  <text x="124" y="151" text-anchor="middle" fill="#99f6e4" font-size="9">Doctor records</text>
  <text x="124" y="165" text-anchor="middle" fill="#99f6e4" font-size="9">consultation audio</text>

  <!-- Arrow 1→2 -->
  <path d="M 207 132 L 258 132" stroke="#2dd4bf40" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 2: AI TRANSCRIPTION ── -->
  <rect x="258" y="88" width="165" height="88" rx="14" fill="#14b8a618" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="340" y="114" text-anchor="middle" font-size="20">🤖</text>
  <text x="340" y="134" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">AI TRANSCRIPT</text>
  <text x="340" y="151" text-anchor="middle" fill="#99f6e4" font-size="9">Instant speech-to-text</text>
  <text x="340" y="165" text-anchor="middle" fill="#99f6e4" font-size="9">+ prescription draft</text>

  <!-- Arrow 2→3 -->
  <path d="M 423 132 L 474 132" stroke="#2dd4bf40" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 3: DOCTOR REVIEW ── -->
  <rect x="474" y="88" width="165" height="88" rx="14" fill="#f59e0b15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="556" y="114" text-anchor="middle" font-size="20">✅</text>
  <text x="556" y="134" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">DOCTOR REVIEW</text>
  <text x="556" y="151" text-anchor="middle" fill="#fde68a" font-size="9">Review &amp; approve</text>
  <text x="556" y="165" text-anchor="middle" fill="#fde68a" font-size="9">AI-drafted Rx</text>

  <!-- Arrow 3→4 -->
  <path d="M 639 132 L 690 132" stroke="#2dd4bf40" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STEP 4: PATIENT PORTAL ── -->
  <rect x="690" y="88" width="75" height="88" rx="14" fill="#14b8a610" stroke="#14b8a6" stroke-width="1"/>
  <text x="727" y="120" text-anchor="middle" font-size="18">📱</text>
  <text x="727" y="140" text-anchor="middle" fill="#2dd4bf" font-size="9" font-weight="700">PATIENT</text>
  <text x="727" y="154" text-anchor="middle" fill="#2dd4bf" font-size="9" font-weight="700">PORTAL</text>
  <text x="727" y="168" text-anchor="middle" fill="#5eead4" font-size="8">instant Rx</text>

  <!-- ── ROLES SECTION ── -->
  <rect x="42" y="210" width="220" height="95" rx="12" fill="#ffffff06" stroke="#1d4a4540" stroke-width="1"/>
  <text x="152" y="232" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600" letter-spacing="1">ROLE-BASED ACCESS</text>
  <!-- Doctor -->
  <rect x="58" y="242" width="55" height="48" rx="8" fill="#14b8a615" stroke="#14b8a640" stroke-width="1"/>
  <text x="85" y="263" text-anchor="middle" font-size="14">👨‍⚕️</text>
  <text x="85" y="280" text-anchor="middle" fill="#2dd4bf" font-size="8" font-weight="600">Doctor</text>
  <!-- Patient -->
  <rect x="124" y="242" width="55" height="48" rx="8" fill="#f59e0b10" stroke="#f59e0b40" stroke-width="1"/>
  <text x="151" y="263" text-anchor="middle" font-size="14">🧑</text>
  <text x="151" y="280" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">Patient</text>
  <!-- Family -->
  <rect x="190" y="242" width="55" height="48" rx="8" fill="#14b8a615" stroke="#14b8a640" stroke-width="1"/>
  <text x="217" y="263" text-anchor="middle" font-size="14">👨‍👩‍👧</text>
  <text x="217" y="280" text-anchor="middle" fill="#2dd4bf" font-size="8" font-weight="600">Family</text>

  <!-- ── PRESCRIPTION CARD ── -->
  <rect x="282" y="210" width="230" height="95" rx="12" fill="#ffffff06" stroke="#1d4a4540" stroke-width="1"/>
  <text x="397" y="232" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600" letter-spacing="1">AI-DRAFTED PRESCRIPTION</text>
  <text x="298" y="252" fill="#2dd4bf" font-size="9">▸</text>
  <text x="310" y="252" fill="#99f6e4" font-size="9">Patient: John Doe · Age: 45</text>
  <text x="298" y="267" fill="#2dd4bf" font-size="9">▸</text>
  <text x="310" y="267" fill="#99f6e4" font-size="9">Dx: Hypertension Stage 1</text>
  <text x="298" y="282" fill="#f59e0b" font-size="9">Rx</text>
  <text x="313" y="282" fill="#fde68a" font-size="9">Amlodipine 5mg · Once daily</text>
  <text x="298" y="297" fill="#f59e0b" font-size="9">Rx</text>
  <text x="313" y="297" fill="#fde68a" font-size="9">Lisinopril 10mg · Morning</text>

  <!-- ── TECH / FEATURES ── -->
  <rect x="532" y="210" width="235" height="95" rx="12" fill="#ffffff06" stroke="#1d4a4540" stroke-width="1"/>
  <text x="649" y="232" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600" letter-spacing="1">FEATURES</text>
  <text x="548" y="252" fill="#2dd4bf" font-size="9">⚡</text>
  <text x="562" y="252" fill="#99f6e4" font-size="9">Speech-to-text AI transcription</text>
  <text x="548" y="267" fill="#2dd4bf" font-size="9">📋</text>
  <text x="562" y="267" fill="#99f6e4" font-size="9">LLM-drafted structured Rx</text>
  <text x="548" y="282" fill="#2dd4bf" font-size="9">🔐</text>
  <text x="562" y="282" fill="#99f6e4" font-size="9">Role-based auth (JWT)</text>
  <text x="548" y="297" fill="#2dd4bf" font-size="9">📱</text>
  <text x="562" y="297" fill="#99f6e4" font-size="9">Real-time patient portal</text>

  <!-- Bottom tagline -->
  <text x="400" y="340" text-anchor="middle" fill="#0f766e" font-size="10" letter-spacing="2">HEALTHCARE AI · DOCTOR → PATIENT WORKFLOW · REAL-TIME Rx DELIVERY</text>

  <!-- Accent lines -->
  <line x1="0" y1="72" x2="800" y2="72" stroke="#14b8a6" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="355" x2="800" y2="355" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
</svg>
