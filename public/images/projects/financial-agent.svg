<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="50%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#0a2a1a"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b98100"/>
      <stop offset="100%" style="stop-color:#10b98155"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff06" stroke-width="1"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600" letter-spacing="3" opacity="0.7">FINANCIAL AI AGENT</text>

  <!-- ── FINANCE AGENT BOX ── -->
  <rect x="50" y="68" width="205" height="90" rx="14" fill="#10b98118" stroke="#10b981" stroke-width="1.5"/>
  <text x="152" y="94" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">FINANCE AGENT</text>
  <text x="152" y="112" text-anchor="middle" fill="#6ee7b7" font-size="10">📈 yfinance tools</text>
  <text x="152" y="130" text-anchor="middle" fill="#6ee7b7" font-size="10">Stock · Fundamentals · Ratings</text>
  <text x="152" y="148" text-anchor="middle" fill="#059669" font-size="9">backed by GPT-4o mini</text>

  <!-- ── WEB AGENT BOX ── -->
  <rect x="545" y="68" width="205" height="90" rx="14" fill="#3b82f618" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="647" y="94" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1">WEB SEARCH AGENT</text>
  <text x="647" y="112" text-anchor="middle" fill="#93c5fd" font-size="10">🌐 DuckDuckGo tools</text>
  <text x="647" y="130" text-anchor="middle" fill="#93c5fd" font-size="10">Latest News · Market Trends</text>
  <text x="647" y="148" text-anchor="middle" fill="#1d4ed8" font-size="9">backed by GPT-4o mini</text>

  <!-- Arrows to center orchestrator -->
  <path d="M 255 113 L 355 185" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <path d="M 545 113 L 445 185" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- ── CENTER ORCHESTRATOR ── -->
  <rect x="310" y="175" width="180" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="198" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">STREAMLIT UI</text>
  <text x="400" y="216" text-anchor="middle" fill="#64748b" font-size="9">runs both agents in parallel</text>

  <!-- ── STOCK CHART (mini) ── -->
  <rect x="50" y="258" width="215" height="110" rx="12" fill="#ffffff05" stroke="#10b98140" stroke-width="1"/>
  <text x="157" y="278" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">MARKET DATA</text>
  <!-- Chart bars -->
  <rect x="70"  y="340" width="14" height="22" fill="url(#chartGrad)" rx="2"/>
  <rect x="90"  y="325" width="14" height="37" fill="url(#chartGrad)" rx="2"/>
  <rect x="110" y="318" width="14" height="44" fill="url(#chartGrad)" rx="2"/>
  <rect x="130" y="330" width="14" height="32" fill="url(#chartGrad)" rx="2"/>
  <rect x="150" y="305" width="14" height="57" fill="url(#chartGrad)" rx="2"/>
  <rect x="170" y="295" width="14" height="67" fill="url(#chartGrad)" rx="2"/>
  <rect x="190" y="308" width="14" height="54" fill="url(#chartGrad)" rx="2"/>
  <rect x="210" y="290" width="14" height="72" fill="#10b981" rx="2" opacity="0.8"/>
  <!-- trend line -->
  <polyline points="77,341 97,326 117,319 137,331 157,306 177,296 197,309 217,291" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <text x="70"  y="375" fill="#64748b" font-size="8">Mon</text>
  <text x="110" y="375" fill="#64748b" font-size="8">Wed</text>
  <text x="150" y="375" fill="#64748b" font-size="8">Fri</text>
  <text x="190" y="375" fill="#34d399" font-size="8">Now</text>

  <!-- ── NEWS FEED (right) ── -->
  <rect x="535" y="258" width="215" height="110" rx="12" fill="#ffffff05" stroke="#3b82f640" stroke-width="1"/>
  <text x="643" y="278" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">LATEST NEWS</text>
  <text x="555" y="297" fill="#475569" font-size="9">●</text>
  <text x="568" y="297" fill="#94a3b8" font-size="9">Fed signals rate hold...</text>
  <text x="555" y="313" fill="#475569" font-size="9">●</text>
  <text x="568" y="313" fill="#94a3b8" font-size="9">NVDA earnings beat Q3...</text>
  <text x="555" y="329" fill="#475569" font-size="9">●</text>
  <text x="568" y="329" fill="#94a3b8" font-size="9">Oil prices surge on supply...</text>
  <text x="555" y="345" fill="#475569" font-size="9">●</text>
  <text x="568" y="345" fill="#94a3b8" font-size="9">Crypto market rebounds...</text>
  <text x="555" y="361" fill="#475569" font-size="9">●</text>
  <text x="568" y="361" fill="#94a3b8" font-size="9">Tech stocks rally on AI...</text>

  <!-- ── CENTER OUTPUT BOX ── -->
  <rect x="295" y="258" width="210" height="110" rx="12" fill="#ffffff05" stroke="#33415580" stroke-width="1"/>
  <text x="400" y="278" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">COMBINED OUTPUT</text>
  <text x="310" y="298" fill="#10b981" font-size="9">▸</text>
  <text x="322" y="298" fill="#6ee7b7" font-size="9">Price: $142.50 (+2.3%)</text>
  <text x="310" y="314" fill="#10b981" font-size="9">▸</text>
  <text x="322" y="314" fill="#6ee7b7" font-size="9">P/E: 28.4  Market cap: $2.1T</text>
  <text x="310" y="330" fill="#3b82f6" font-size="9">▸</text>
  <text x="322" y="330" fill="#93c5fd" font-size="9">Analysts: 18 Buy / 4 Hold</text>
  <text x="310" y="346" fill="#3b82f6" font-size="9">▸</text>
  <text x="322" y="346" fill="#93c5fd" font-size="9">News: Strong Q3 expected</text>

  <!-- separator label -->
  <line x1="50" y1="248" x2="750" y2="248" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom tagline -->
  <text x="400" y="395" text-anchor="middle" fill="#374151" font-size="10" letter-spacing="2">MARKET DATA · NEWS SEARCH · PARALLEL AGENTS · MARKDOWN TABLES</text>

  <!-- Accent lines -->
  <line x1="0" y1="56" x2="800" y2="56" stroke="#10b981" stroke-width="0.5" opacity="0.25"/>
  <line x1="0" y1="408" x2="800" y2="408" stroke="#3b82f6" stroke-width="0.5" opacity="0.25"/>
</svg>
