<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background:#0a0f1e">
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f9731620" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Background glow -->
  <ellipse cx="400" cy="225" rx="280" ry="160" fill="#f97316" opacity="0.04"/>

  <!-- CI/CD Pipeline flow: PR → Lint → Sample Eval → Full Eval → Dashboard -->
  <!-- Connector lines -->
  <line x1="150" y1="180" x2="220" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="310" y1="180" x2="370" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="460" y1="180" x2="520" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="610" y1="180" x2="650" y2="180" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Step 1: PR -->
  <rect x="60" y="155" width="90" height="50" rx="8" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="105" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">PULL</text>
  <text x="105" y="186" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">REQUEST</text>
  <text x="105" y="198" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">git push</text>

  <!-- Arrow 1 -->
  <polygon points="225,176 220,180 225,184" fill="#f97316" opacity="0.5"/>

  <!-- Step 2: Lint -->
  <rect x="230" y="155" width="80" height="50" rx="8" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="270" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">LINT</text>
  <text x="270" y="186" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">+ TYPE</text>
  <text x="270" y="198" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">ruff · mypy</text>

  <!-- Arrow 2 -->
  <polygon points="375,176 370,180 375,184" fill="#f97316" opacity="0.5"/>

  <!-- Step 3: Sample Eval (10Q) -->
  <rect x="380" y="148" width="80" height="64" rx="8" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="2"/>
  <text x="420" y="168" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">SAMPLE</text>
  <text x="420" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">EVAL</text>
  <text x="420" y="194" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">10 questions</text>
  <text x="420" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">PR gate</text>

  <!-- Arrow 3 -->
  <polygon points="525,176 520,180 525,184" fill="#f97316" opacity="0.5"/>

  <!-- Step 4: Full Eval (30Q) -->
  <rect x="530" y="148" width="80" height="64" rx="8" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="2"/>
  <text x="570" y="168" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">FULL</text>
  <text x="570" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">EVAL</text>
  <text x="570" y="194" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">30 golden Qs</text>
  <text x="570" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">on merge</text>

  <!-- Arrow 4 -->
  <polygon points="655,176 650,180 655,184" fill="#f97316" opacity="0.5"/>

  <!-- Step 5: Dashboard -->
  <rect x="660" y="155" width="80" height="50" rx="8" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="700" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">DASH</text>
  <text x="700" y="186" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700" letter-spacing="1">BOARD</text>
  <text x="700" y="198" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9731670">Next.js</text>

  <!-- Metrics bar chart (bottom) -->
  <text x="400" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9731690" letter-spacing="2">LLM-AS-JUDGE SCORES</text>

  <!-- Bar chart labels -->
  <text x="100" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">faithfulness</text>
  <text x="190" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">relevance</text>
  <text x="280" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">precision</text>
  <text x="370" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">recall</text>
  <text x="460" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">hallucination</text>
  <text x="560" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">citation</text>
  <text x="655" y="380" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff60">latency</text>

  <!-- Bars -->
  <rect x="68" y="305" width="64" height="68" rx="4" fill="#f97316" opacity="0.75"/>
  <rect x="158" y="315" width="64" height="58" rx="4" fill="#f97316" opacity="0.65"/>
  <rect x="248" y="320" width="64" height="53" rx="4" fill="#f97316" opacity="0.55"/>
  <rect x="338" y="310" width="64" height="63" rx="4" fill="#f97316" opacity="0.70"/>
  <rect x="428" y="330" width="64" height="43" rx="4" fill="#f97316" opacity="0.45"/>
  <rect x="526" y="308" width="64" height="65" rx="4" fill="#f97316" opacity="0.72"/>
  <rect x="623" y="318" width="64" height="55" rx="4" fill="#f97316" opacity="0.60"/>

  <!-- Bar top values -->
  <text x="100" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">0.98</text>
  <text x="190" y="310" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">0.91</text>
  <text x="280" y="315" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">0.87</text>
  <text x="370" y="305" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">0.94</text>
  <text x="460" y="325" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">7.6%</text>
  <text x="558" y="303" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">0.96</text>
  <text x="655" y="313" text-anchor="middle" font-family="monospace" font-size="9" fill="#f97316" font-weight="700">1.2s</text>

  <!-- Bottom baseline -->
  <line x1="50" y1="373" x2="750" y2="373" stroke="#f9731630" stroke-width="1"/>

  <!-- Label -->
  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="11" fill="#f97316" font-weight="700" letter-spacing="3" opacity="0.6">MEDEVAL AI · LLM CI/CD</text>
</svg>
